post:
  tags:
    - Authentication

  summary: Request password reset

  security: []

  description: |
    Sends a password-reset OTP when an eligible account exists.

    For security, the API returns a generic response and does not
    reveal whether an email address exists.

  requestBody:
    required: true

    content:
      application/json:

        schema:
          $ref: "../../components/schemas/auth.yaml#/ForgotPasswordRequest"

        example:
          email: user@example.com

  responses:

    "202":
      description: Password reset request accepted

      content:
        application/json:

          schema:
            $ref: "../../components/schemas/auth.yaml#/MessageResponse"

          example:
            success: true
            message: If an account exists for this email, a verification code has been sent.

    "400":
      description: Invalid email

    "429":
      description: Too many password-reset requests