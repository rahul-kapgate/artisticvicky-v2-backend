post:
  tags:
    - Authentication

  summary: Reset password

  security: []

  description: |
    Changes the user's password using the short-lived resetToken.

    The new password and confirmPassword fields must match.

  requestBody:
    required: true

    content:
      application/json:

        schema:
          $ref: "../../components/schemas/auth.yaml#/ResetPasswordRequest"

        example:
          resetToken: 8cc92b8e0670bfb7349d87ac4e1128746daf098e017d15ca
          newPassword: NewPassword@123
          confirmPassword: NewPassword@123

  responses:

    "200":
      description: Password changed successfully

      content:
        application/json:

          schema:
            $ref: "../../components/schemas/auth.yaml#/MessageResponse"

          example:
            success: true
            message: Password changed successfully.

    "400":
      description: |
        Invalid reset token, password mismatch,
        password reuse or expired reset session.

      content:
        application/json:
          schema:
            $ref: "../../components/schemas/common.yaml#/ErrorResponse"

    "429":
      description: Too many password reset attempts