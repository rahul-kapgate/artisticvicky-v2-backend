post:
  tags:
    - Authentication

  summary: Verify password reset OTP

  security: []

  description: |
    Verifies the 6-digit password-reset OTP.

    If successful, returns a short-lived resetToken that can
    be used with the password reset endpoint.

  requestBody:
    required: true

    content:
      application/json:

        schema:
          $ref: "../../components/schemas/auth.yaml#/ForgotPasswordVerifyRequest"

        example:
          email: user@example.com
          otp: "123456"

  responses:

    "200":
      description: OTP verified successfully

      content:
        application/json:

          schema:
            $ref: "../../components/schemas/auth.yaml#/ForgotPasswordVerifyResponse"

    "400":
      description: Invalid or expired verification code

    "429":
      description: Too many OTP verification attempts